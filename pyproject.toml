[tool.uv.workspace]
members = ["ipm", "simplex", "common", "pdhg"]

[project]
name = "linopt"
version = "0.1.0"
description = "Linear optimization solvers"
requires-python = ">=3.13"
dependencies = [
    "common",
    "ipm",
    "pytest-unordered>=0.7.0",
    "scikit-umfpack>=0.4.2",
    "scipy>=1.17.1",
    "simplex",
    "pdhg",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.uv.sources]
common = { workspace = true }
ipm = { workspace = true }
simplex = { workspace = true }
pdhg = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["common/tests", "ipm/tests", "simplex/tests", "pdhg/tests"]
addopts = "-ra -v"
pythonpath = ["ipm/src", "simplex/src", "common/src", "pdhg/src"]

[tool.mypy]
strict = true
ignore_missing_imports = true
